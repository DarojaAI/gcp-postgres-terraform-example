name: 'Terraform Apply'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    env:
      TF_VERSION: 1.5.0
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install validators package
        run: |
          pip install git+https://github.com/DarojaAI/gcp-postgres-validators.git@v1.0.0

      - name: Terraform plan
        run: |
          cd terraform
          terraform init -backend=false
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="name_prefix=demo" \
            -var="environment=dev" \
            -out=tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Terraform apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Extract outputs
        run: |
          cd terraform
          terraform output -json > /tmp/tf-outputs.json

      - name: Validate deployment
        run: |
          python3 scripts/validate-apply.py
        env:
          TERRAFORM_OUTPUTS: /tmp/tf-outputs.json

      - name: Deployment summary
        run: |
          echo "## Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/tf-outputs.json | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
